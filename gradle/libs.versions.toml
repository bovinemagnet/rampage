[versions]
# Plugins
gatling-plugin = "3.15.0"
quarkus = "3.35.3"

# Runtime libraries
# Next major: tools.jackson.core:jackson-databind:3.1.3
jackson = "2.21.3"
swagger-parser = "2.1.25"
slf4j = "2.0.17"
logback = "1.5.32"
h2 = "2.4.240"
postgresql = "42.7.8"
hikari = "7.0.2"
gatling = "3.15.0"

# Test libraries
junit = "6.0.3"
mockito = "5.23.0"
assertj = "3.27.7"

[libraries]
# Jackson (YAML config parsing)
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# OpenAPI parser (used by the importOpenApi scaffolding task)
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swagger-parser" }

# Database / connection pool (SQL feeder)
h2 = { module = "com.h2database:h2", version.ref = "h2" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

# Gatling (compileOnly for factories, gatling source set, and tests)
gatling-charts-highcharts = { module = "io.gatling.highcharts:gatling-charts-highcharts", version.ref = "gatling" }

# Quarkus (console subproject)
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[bundles]
jackson = ["jackson-databind", "jackson-dataformat-yaml", "jackson-datatype-jdk8"]
logging = ["slf4j-api", "logback-classic"]

[plugins]
gatling = { id = "io.gatling.gradle", version.ref = "gatling-plugin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
