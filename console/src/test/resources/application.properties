# Test-time overrides: bind the Carbon receiver to an OS-allocated port so
# parallel test runs (and developer machines that already have something on
# 2003) never clash. Production binds 2003 by default via the main
# application.properties.
rampage.console.carbon-port=0

# Results store: in-memory H2 for the test profile so suites never touch the
# real data/ file and every boot starts from an empty schema.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:rampage-test;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
