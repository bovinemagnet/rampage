quarkus.application.name=rampage-console
quarkus.http.port=8090
quarkus.http.host=localhost

# Path defaults are intentionally NOT set here. Each path-aware bean
# (ConfigBrowser, RunHistoryService, VerificationConfig, RunOrchestrator)
# resolves the actual repo root by walking up from user.dir until it finds
# settings.gradle.kts. This lets the console work whether it's launched from
# the repo root, the console subproject, or anywhere else.
#
# Overrides (when needed):
#   rampage.console.repo-root              - explicit repo root
#   rampage.console.config-dir             - YAML root (default: <root>/config)
#   rampage.console.reports-dir            - Gatling output (default: <root>/build/reports/gatling)
#   rampage.console.verification.staging-dir
#                                           (default: <root>/build/console-verification)

rampage.console.gradle-command=./gradlew
rampage.console.gatling-task=gatlingRun
rampage.console.kill-timeout-seconds=5

# Sample endpoints exposed for self-verification + manual probing.
quarkus.smallrye-graphql.root-path=/verification/graphql
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.ui.root-path=/verification/graphql-ui

# Carbon receiver for live metrics (Gatling Graphite writer pushes here).
rampage.console.carbon-port=2003
rampage.console.carbon-host=0.0.0.0
rampage.console.live-metrics=true

# Quiet the noise; the console itself emits the meaningful log lines.
quarkus.log.level=INFO
quarkus.log.category."io.rampage.console".level=DEBUG
