gatling {
  core {
    encoding = "utf-8"
    pressEnterToContinue = false
    elFileBodiesCacheMaxCapacity = 200
    rawFileBodiesCacheMaxCapacity = 200
    rawFileBodiesInMemoryMaxSize = 1000
  }

  charting {
    indicators {
      lowerBound = 100
      higherBound = 1000
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }

  http {
    fetchedCssCacheMaxCapacity = 200
    fetchedHtmlCacheMaxCapacity = 200
    perUserCacheMaxCapacity = 200
    warmUpUrl = ""
    enableGA = false

    ahc {
      keepAlive = true
      connectTimeout = 10000
      handshakeTimeout = 10000
      pooledConnectionIdleTimeout = 60000
      maxRetry = 2
      requestTimeout = 60000
      enableHttp2 = false
    }
  }

  data {
    # CLI default: console + file writers only.
    # The console subproject (see :console) launches Gatling with
    #   -Drampage.console.extra-writer=graphite
    # which adds the stock GraphiteDataWriter to this list (HOCON optional
    # substitution removes the entry when the property is unset).
    writers = ["console", "file", ${?rampage.console.extra-writer}]

    graphite {
      protocol = "tcp"
      host = "localhost"
      host = ${?rampage.console.carbon-host}
      port = 2003
      port = ${?rampage.console.carbon-port}
      writePeriod = 1
      rootPathPrefix = "rampage"
    }
  }
}
