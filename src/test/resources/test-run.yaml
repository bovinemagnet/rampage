run:
  name: test-run
  description: "Test load test run"
  scenarios:
    - test-scenario
  workload:
    model: ramp-and-hold
    rampDurationSeconds: 10
    holdDurationSeconds: 30
    targetCallsPerSecond: 5
  assertions:
    globalResponseTimeMaxMs: 1000
    globalResponseTimeMeanMs: 200
    globalErrorRatePercent: 1.0
  reporting:
    outputDir: build/reports/test
