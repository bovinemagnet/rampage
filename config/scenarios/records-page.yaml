id: records-page
name: Records Pagination GraphQL
protocol: graphql
endpointRef: graphql
operationName: Records

description: >
  Issues a Records(pageNumber, pageSize) GraphQL query. pageNumber is
  driven from the app_local.items table via the JDBC feeder;
  pageSize is fixed at 100 to match the GraphQL default and the page
  arithmetic in records-pages.sql.

headers:
  X-Scenario-Id: records-page
  X-Business-Process: records-pagination

request:
  graphqlQueryFile: config/graphql/records.graphql
  variables:
    pageNumber: ${feeder:pageNumber}
    pageSize: 100

feeder:
  type: jdbc
  databaseRef: app
  sqlFile: config/queries/records-pages.sql
  # `random` picks a row at random for each virtual user, so the load is
  # spread across pages instead of always hammering page 0. Switch to
  # `circular` if you want each row used in order.
  strategy: random
  preload: true
  failIfEmpty: true
  columns:
    pageNumber:
      type: integer
      required: true
      sessionKey: pageNumber

checks:
  httpStatus: 200
  jsonPath:
    - path: $.errors
      expectation: absentOrEmpty
    - path: $.data.records
      expectation: exists

workload:
  inheritFromRun: true

tags:
  - graphql
  - app
  - records
  - read-only

safety:
  mutating: false
  idempotent: true
