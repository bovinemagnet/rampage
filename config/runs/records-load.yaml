id: records-load
name: App Records Pagination Load
version: 1
environment: app-local

metadata:
  owner: example-team
  application: example
  service: example-graphql
  description: >
    Paginates through records via the App GraphQL endpoint, driving
    pageNumber values from the local app_local.items table.

scenarios:
  - id: records-page
    file: config/scenarios/records-page.yaml
    enabled: true
    weight: 100

execution:
  mode: open
  workload:
    # Hold a steady 5 req/s for 30s — modest enough to validate end-to-end
    # without hammering local Postgres or the App server. Crank rate.from /
    # rate.to up (or switch to ramp-and-hold) once the smoke passes.
    type: constant
    duration: 30s
    rate:
      unit: per-second
      from: 5
      to: 5

assertions:
  global:
    maxErrorPercentage: 0.5
    maxResponseTimeP95Millis: 1500
    maxResponseTimeP99Millis: 3000

reporting:
  outputDirectory: build/reports/gatling
  writeRunMetadata: true
  redactSecrets: true

safety:
  dryRun: false
